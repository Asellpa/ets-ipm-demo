name: React, API and Browser QA
on:
  push:
    branches: [react-migration, staging, main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ipm_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ipm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipm_test -d ipm_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ETS_TEST_DATABASE_URL: postgresql://ipm_test:synthetic-ci-only@127.0.0.1:5432/ipm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm ci
      - name: Install React dependencies
        run: npm ci --prefix react
      - name: TypeScript and production build
        run: npm --prefix react run build
      - name: ESLint
        run: npm --prefix react run lint
      - name: Isolated API smoke tests
        env:
          ETS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:api
      - name: Production container build
        run: docker build --file deploy/Dockerfile --build-arg APP_VERSION=${{ github.sha }} --tag ets-ipm:ci .
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Isolated browser tests
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

