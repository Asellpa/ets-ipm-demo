name: React and API QA
on:
  push:
    branches: [react-migration, staging, main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        run: npm install --prefix react
      - name: TypeScript and production build
        run: npm --prefix react run build
      - name: ESLint
        run: npm --prefix react run lint
      - name: Isolated API smoke tests
        run: npm run test:api
