name: React, API and Browser QA
on:
  push:
    branches: [react-migration, staging, main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install
      - name: Install React dependencies
        run: npm install --prefix react
      - name: TypeScript and production build
        run: npm --prefix react run build
      - name: ESLint
        run: npm --prefix react run lint
      - name: Isolated API smoke tests
        run: npm run test:api
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Isolated browser tests
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

