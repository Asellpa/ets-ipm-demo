<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETS Integrated Project Management</title><link rel="stylesheet" href="/styles.css"></head><body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="logo">ETS</div><p class="eyebrow">Integrated Project Management</p><h1>Welcome back</h1><p class="muted">Department project, task, capacity and reporting workspace.</p><label>User / Username<input id="loginUser" value="Stephan" required></label><label>User ID<input id="loginId" value="123" required></label><label>Password<input id="loginPassword" type="password" value="Testing" required></label><p id="loginError" class="error"></p><button class="primary full">Sign in</button><small>Initial administrator: Stephan / 123 / Testing</small></form></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><div class="logo small">ETS</div><div><b>IPM</b><small>Project workspace</small></div></div><nav id="nav"><button data-view="overview" class="active">Overview</button><button data-view="commercial">Commercial RFQs</button><button data-view="eer">EER Support</button><button data-view="projects">Projects</button><button data-view="mytasks">My Tasks</button><button data-view="capacity">Capacity</button><button data-view="manpower">Manpower Plan</button><button data-view="reports">Reports</button><button data-view="team">Team Roster</button><button data-view="settings">Field Settings</button><button id="auditNav" data-view="audit">Audit & History</button><div id="usersNav" class="nav-group hidden"><span>USERS</span><button data-view="manageusers">Manage Users</button><button data-view="roles">Role Management</button></div></nav><div class="side-bottom"><select id="role" class="hidden"><option selected>Senior Management</option></select><div class="person"><span class="avatar">S</span><div><b id="who">Stephan</b><small id="profileName">System Administrator</small></div></div><button id="logout" class="ghost full">Log out</button></div></aside>
<main><header><div><p class="eyebrow">Engineering & Technical Services</p><h2 id="title">Overview</h2></div><div class="actions"><input id="search" placeholder="Search projects or tasks…"><button id="myOnly" class="ghost">My tasks</button><button id="notif" class="ghost">Notifications <span id="notifCount"></span></button><button id="import" class="ghost">Import</button><button id="export" class="ghost">Export</button><button id="newProject" class="primary">+ New project</button></div></header><section id="root" class="content"></section></main></div>
<div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><aside id="drawer" class="drawer hidden"></aside><input id="fileInput" type="file" accept=".csv" hidden><div id="toast" class="toast hidden"></div><script src="/app.js"></script><script src="/admin.js"></script></body></html>
