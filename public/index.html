<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ETS Integrated Project Management</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">ETS</div>
      <p class="eyebrow">Integrated Project Management</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to access your project workspace.</p>
      <label>User<input id="loginUser" autocomplete="username" required></label>
      <label>User ID<input id="loginId" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error"></p>
      <button class="primary full" type="submit">Sign in</button>
      <p class="demo-hint">Demo access: Stephan / 123 / Testing</p>
    </form>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">ETS</span><div><strong>IPM</strong><small>Project workspace</small></div></div>
      <nav id="nav">
        <button data-view="overview" class="active">Overview</button>
        <button data-view="projects">Projects</button>
        <button data-view="mytasks">My Tasks</button>
        <button data-view="capacity">Capacity</button>
        <button data-view="reports">Reports</button>
        <button id="auditNav" data-view="audit">Audit & History</button>
      </nav>
      <div class="sidebar-bottom">
        <label>Demo role<select id="roleSelect"><option>Senior Management</option><option>LTSE</option><option>TSE/JTSE</option></select></label>
        <div class="user-card"><div class="avatar">S</div><div><strong id="signedUser">Stephan</strong><small>ID 123</small></div></div>
        <button id="logoutBtn" class="ghost">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">Engineering & Technical Services</p><h2 id="pageTitle">Overview</h2></div>
        <div class="top-actions"><input id="search" placeholder="Search projects or tasks…"><button id="notificationsBtn" class="icon-btn">Notifications <span id="notificationCount"></span></button><button id="auditBtn" class="icon-btn">Audit</button><button id="newProjectBtn" class="primary">+ New project</button></div>
      </header>
      <section id="viewRoot" class="content"></section>
    </main>
  </div>

  <aside id="drawer" class="drawer hidden"><button id="drawerClose" class="drawer-close">×</button><div id="drawerBody"></div></aside>
  <div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="drawer-close">×</button><div id="modalBody"></div></div></div>
  <div id="projectModal" class="project-modal hidden"><div class="project-modal-card"><button id="projectModalClose" class="drawer-close">×</button><div id="projectModalBody"></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
